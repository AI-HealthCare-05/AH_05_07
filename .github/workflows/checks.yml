name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: ci classify
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      web: ${{ steps.classify.outputs.web }}
      scene: ${{ steps.classify.outputs.scene }}
      model_web: ${{ steps.classify.outputs.model_web }}
      deployment: ${{ steps.classify.outputs.deployment }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify affected CI lane
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/classify_ci_lane.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  web:
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: npm ci

      - name: Verify production web environment guard
        run: npm run test:production-web-env

      - name: Verify scene-specific controls
        if: needs.classify.outputs.scene == 'true'
        run: |
          npm run test:scene-manifest
          node --test ../tools/character-preview/test_production_isolation.cjs
          node --check scripts/measure-scene-android.mjs
          node --check scripts/profile-scene-memory.mjs
          node --test scripts/inspect-scene-heap.test.mjs
          node --test scripts/summarize-scene-heap-growth.test.mjs
          node --check scripts/serve-scene-device-review.mjs
          node --check scripts/serve-scene-phone-review.mjs

      - name: Verify frozen browser artifact history
        if: needs.classify.outputs.model_web == 'true'
        run: |
          node --test scripts/verify-model-v2-assets.test.mjs
          node scripts/verify-model-v2-assets.mjs --history --fetch-source

      - name: Build web client
        run: npm run build

      - name: Verify secret boundary controls
        run: |
          python3 ../scripts/ci/verify_secret_boundary.py --self-test
          python3 ../scripts/ci/verify_secret_boundary.py --web-dist dist

  deployment-smoke:
    needs: classify
    if: needs.classify.outputs.deployment == 'true' || needs.classify.outputs.full == 'true'
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Verify deployment smoke controls
        run: python3 scripts/ci/verify_deployment_smoke.py --self-test

  python-lint:
    name: python lint payload
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Verify bounded AI toolchain
        run: |
          python3 scripts/ci/verify_ai_toolchain.py --self-test
          python3 scripts/ci/verify_ai_toolchain.py
          python3 scripts/ci/verify_model_gate_1b_contract.py --self-test
          python3 scripts/ci/verify_model_gate_1b_contract.py

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Check (Linting)
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

  lint:
    name: lint
    if: always()
    needs: [classify, python-lint]
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Verify lint lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_LANE: ${{ needs.classify.outputs.full }}
          PYTHON_LINT_RESULT: ${{ needs.python-lint.result }}
          LANE: ${{ needs.classify.outputs.lane }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          if [ "$FULL_LANE" = "true" ]; then
            test "$PYTHON_LINT_RESULT" = "success"
            echo "lint: full Python/AI payload passed"
          else
            echo "lint: lightweight $LANE lane; Python/AI payload not applicable"
          fi

  python-test:
    name: python test payload
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pw1234
          MYSQL_DATABASE: ai_health
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppw1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --group app --group ai --frozen

      - name: Run Tests with Coverage
        run: |
          uv run coverage run -m pytest app tests
          uv run coverage report -m

  test:
    name: test
    if: always()
    needs: [classify, web, deployment-smoke, python-test]
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Verify test lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WEB_LANE: ${{ needs.classify.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          FULL_LANE: ${{ needs.classify.outputs.full }}
          PYTHON_TEST_RESULT: ${{ needs.python-test.result }}
          DEPLOYMENT_LANE: ${{ needs.classify.outputs.deployment }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-smoke.result }}
          LANE: ${{ needs.classify.outputs.lane }}
        run: |
          test "$CLASSIFY_RESULT" = "success"

          if [ "$WEB_LANE" = "true" ]; then
            test "$WEB_RESULT" = "success"
            echo "test: web build/env/secret-boundary payload passed"
          fi

          if [ "$FULL_LANE" = "true" ]; then
            test "$PYTHON_TEST_RESULT" = "success"
            echo "test: full Python/MySQL payload passed"
          else
            echo "test: lightweight $LANE lane; Python/MySQL payload not applicable"
          fi

          if [ "$FULL_LANE" = "true" ] || [ "$DEPLOYMENT_LANE" = "true" ]; then
            test "$DEPLOYMENT_RESULT" = "success"
            echo "test: deployment-smoke payload passed"
          fi
