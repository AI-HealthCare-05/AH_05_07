name: Browser E2E

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/browser-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/browser-e2e.yml"

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run browser evidence fixtures
        run: npm run test:e2e
