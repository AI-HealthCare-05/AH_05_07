name: Browser E2E

on:
  workflow_dispatch:
  schedule:
    # Broad confidence once per night (03:30 Asia/Seoul).
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

# Broad browser confidence is deliberately outside the PR/main merge path.
# Required PR merge checks are owned by checks.yml: lint + test.

jobs:
  nightly-core:
    name: nightly-core
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: npm ci
      - name: Run core, Journey and asset confidence
        run: node scripts/browser-ci-modules.mjs core journey-full assets
      - name: Upload failed Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-nightly-core-${{ github.run_attempt }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  nightly-scene:
    name: nightly-scene
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run scene confidence
        run: node scripts/browser-ci-modules.mjs scene
      - name: Upload failed Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-nightly-scene-${{ github.run_attempt }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  nightly-model:
    name: nightly-model
    runs-on: ${{ vars.SK7_CLOUD_RUNNER == 'blacksmith-4vcpu-ubuntu-2404' && vars.SK7_CLOUD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run Model V2 confidence
        run: node scripts/browser-ci-modules.mjs model
      - name: Upload failed Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-nightly-model-${{ github.run_attempt }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 3
