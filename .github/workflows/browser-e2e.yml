name: Browser E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/mvp1-capture.cjs"
      - "tools/submission-*"
      - "docs/mvp1-*.md"
      - "docs/evidence/mvp1/**"
      - ".github/workflows/browser-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "tools/mvp1-capture.cjs"
      - "tools/submission-*"
      - "docs/mvp1-*.md"
      - "docs/evidence/mvp1/**"
      - ".github/workflows/browser-e2e.yml"

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: browser-e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run focused browser regression for pull requests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Run focused Journey regression for pull requests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:ui:pr

      - name: Check local submission capture script syntax
        run: |
          node --check ../tools/mvp1-capture.cjs
          node --check ../tools/submission-record.cjs
          node --check ../tools/submission-video-check.cjs
          node --check ../tools/submission-slides.mjs

  browser-e2e-main:
    name: browser-e2e (${{ matrix.suite.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: browser evidence fixtures
            command: npm run test:e2e
          - name: companion runtime transport
            command: node scripts/diagnose-companion-r2.mjs
          - name: review companion runtime
            command: npm run test:e2e:review
          - name: production-on companion
            command: npm run test:e2e:production:on
          - name: saved-scene migration parity
            command: npm run test:e2e:saved-scene
          - name: S02 and S10 review scenes
            command: npm run test:e2e:scene
          - name: journey UI and normal auth boundaries
            command: npm run test:e2e:ui
          - name: submission capture script syntax
            command: >-
              node --check ../tools/mvp1-capture.cjs &&
              node --check ../tools/submission-record.cjs &&
              node --check ../tools/submission-video-check.cjs &&
              node --check ../tools/submission-slides.mjs
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.suite.name }}
        run: ${{ matrix.suite.command }}
