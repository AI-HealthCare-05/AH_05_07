name: Trusted local runners

on:
  workflow_dispatch:
    inputs:
      target:
        description: Trusted developer runner to exercise
        required: true
        default: both
        type: choice
        options:
          - linux
          - macos
          - both

permissions:
  contents: read

concurrency:
  group: trusted-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-heavy:
    name: trusted Linux heavy verification
    if: ${{ inputs.target == 'linux' || inputs.target == 'both' }}
    runs-on: [self-hosted, sk7-linux]
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # The persistent WSL runner service owns _work as uid 1000.
      # Match that uid so container actions can write GitHub file-command temp files.
      options: --user 1000
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web client
        run: npm run build

      - name: Run browser regression
        run: npm run test:e2e

      - name: Run Journey PR regression
        run: npm run test:e2e:ui:pr

      - name: Run companion review regression
        run: npm run test:e2e:review

      - name: Run companion production-on regression
        run: npm run test:e2e:production:on

  macos-smoke:
    name: trusted macOS smoke
    if: ${{ inputs.target == 'macos' || inputs.target == 'both' }}
    runs-on: [self-hosted, sk7-macos]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium once on the persistent runner
        run: npx playwright install chromium

      - name: Build web client
        run: npm run build

      - name: Run companion review smoke
        run: npm run test:e2e:review
