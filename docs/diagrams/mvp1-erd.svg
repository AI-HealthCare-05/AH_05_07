<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
<title id="title">SK7 현재 ERD와 목표 엔터티</title><desc id="desc">auth.users의 소유 관계와 현재 4개 제품 테이블. 목표 risk assessment와 model version은 별도 표시.</desc>
<style>text{font-family:'Malgun Gothic',sans-serif;fill:#183136;font-size:17px}.heading{font-size:28px;font-weight:bold}.small{font-size:14px}.box{fill:white;stroke:#638576;stroke-width:2}.edge{fill:none;stroke:#638576;stroke-width:2}.target{fill:#fffaf0;stroke:#997a44;stroke-width:2;stroke-dasharray:8 6}</style>
<rect width="1280" height="1000" fill="#f3f5f1"/><text x="40" y="50" class="heading">SK7 · 현재 제품 ERD / 목표 엔터티</text><text x="40" y="82" class="small">255c904의 migrations 기준. 주요 필드·관계만 표시; legacy MySQL 인증 모델은 현재 웹 경로에서 제외.</text>
<rect x="500" y="115" width="275" height="85" rx="8" class="box"/><text x="520" y="148">auth.users</text><text x="520" y="178">id uuid · PK</text>
<path d="M500 155H240V245 M775 155H1040V245 M635 200V495" class="edge"/>
<text x="280" y="143">1 → N</text><text x="860" y="143">1 → N</text><text x="645" y="475">1 → N</text>
<rect x="40" y="245" width="420" height="215" rx="8" class="box"/><text x="60" y="280">blood_pressure_observations</text><text x="60" y="312">id PK / user_id FK → auth.users</text><text x="60" y="343">observed_on · period · systolic · diastolic</text><text x="60" y="374">created_at · expires_at</text><text x="60" y="411" class="small">UNIQUE(user_id, observed_on, period)</text><text x="60" y="437" class="small">RLS: 본인 소유 + 미만료 행</text>
<rect x="830" y="245" width="410" height="215" rx="8" class="box"/><text x="850" y="280">challenge_events · legacy</text><text x="850" y="312">id PK / user_id FK → auth.users</text><text x="850" y="343">observed_on · action_id · status</text><text x="850" y="374">created_at · expires_at</text><text x="850" y="411" class="small">UNIQUE(user_id, observed_on, action_id)</text><text x="850" y="437" class="small">현재 active challenge와 별도</text>
<rect x="410" y="505" width="430" height="220" rx="8" class="box"/><text x="430" y="540">active_challenges</text><text x="430" y="572">id PK / user_id FK → auth.users</text><text x="430" y="603">action_id · starts_on · ends_on · status</text><text x="430" y="634">first_checkin_on · created_at · expires_at</text><text x="430" y="670" class="small">사용자당 active 1개 partial UNIQUE</text><text x="430" y="697" class="small">7일 제약 / 첫 체크인 이후 action 잠금</text>
<rect x="865" y="505" width="375" height="220" rx="8" class="box"/><text x="885" y="540">challenge_checkins</text><text x="885" y="572">id PK / (challenge_id, user_id) FK</text><text x="885" y="603">action_id · observed_on · status</text><text x="885" y="634">created_at · expires_at</text><text x="885" y="670" class="small">UNIQUE(user_id, challenge_id, observed_on)</text><text x="885" y="697" class="small">동일 소유자 composite FK / 상태만 수정</text>
<path d="M840 595H865" class="edge"/><text x="847" y="486" class="small">1 → N</text>
<text x="40" y="766" class="small">4개 제품 테이블: RLS · expires_at 접근 차단 · 이후 cron 물리 정리. 위 auth.users FK는 삭제 cascade.</text>
<text x="40" y="807" font-weight="bold">목표 · 아직 없는 테이블</text>
<rect x="40" y="835" width="510" height="100" rx="8" class="target"/><text x="60" y="872">MODEL_VERSION → RISK_ASSESSMENT (1:N)</text><text x="60" y="907" class="small">모델 버전·결과 보관은 개념 설계; migration 없음</text>
<rect x="605" y="835" width="635" height="100" rx="8" class="target"/><text x="625" y="872">AUTH_USER → RISK_ASSESSMENT (1:N)</text><text x="625" y="907" class="small">승인된 입력/모델/보존·출시 계약 후 별도 구현</text>
<text x="40" y="972" class="small">스키마 존재·로컬 검증과 실제 운영 적용/만료 검증은 별개다. 전체 필드는 migration 원본 참조.</text>
</svg>
